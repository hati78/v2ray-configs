name: Final VLESS Split NekoBox Safe

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Prepare output files
        run: |
          > Protocols/vless_game.txt
          > Protocols/vless_stream.txt
          > Protocols/vless_download.txt

      - name: Country-based split safe
        run: |
          COUNT_GAME=0
          COUNT_STREAM=0
          COUNT_DOWNLOAD=0

          while read -r line; do
            line=$(echo "$line" | sed 's/^[ \t]*//;s/[ \t]*$//') # trim
            [ -z "$line" ] && continue                             # skip empty

            # --- GAME ---
            if echo "$line" | grep -Eqi "(germany|de|frankfurt|netherlands|nl|finland|fi|turkey|tr|france|fr)"; then
              if [ $COUNT_GAME -lt 1200 ]; then
                echo "$line" >> Protocols/vless_game.txt
                COUNT_GAME=$((COUNT_GAME+1))
              fi

            # --- STREAM ---
            elif echo "$line" | grep -Eqi "(uk|london|england|gb|germany|de|netherlands|nl|france|fr)"; then
              if [ $COUNT_STREAM -lt 1200 ]; then
                echo "$line" >> Protocols/vless_stream.txt
                COUNT_STREAM=$((COUNT_STREAM+1))
              fi

            # --- DOWNLOAD (all others) ---
            else
              if [ $COUNT_DOWNLOAD -lt 1200 ]; then
                echo "$line" >> Protocols/vless_download.txt
                COUNT_DOWNLOAD=$((COUNT_DOWNLOAD+1))
              fi
            fi
          done < Protocols/vless.txt

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Protocols/vless_*.txt
          git commit -m "Safe split for NekoBox" || exit 0
          git push
